name: Todo CLI - Test & Copilot Review

# 关联 todo-cli/ Python 项目 + Jira 工单评审：
#   1. 监听 todo-cli/ 代码变更，运行 ruff + pytest 单元测试
#   2. 使用 GitHub Copilot CLI 审查代码，并把改进建议写入 Job Summary / artifact
#   3. workflow_dispatch 触发时，通过 Jira REST API 拉取指定工单（默认 TC-1），
#      让 Copilot CLI 结合 todo-cli/ 代码评审工单，最终把评审结果以评论形式
#      通过 Jira REST API 写回原工单。
on:
  push:
    branches: [main, develop]
    paths:
      - 'todo-cli/**'
      - '.github/workflows/todo-cli-ci.yml'
      - '.github/scripts/**'
  pull_request:
    paths:
      - 'todo-cli/**'
      - '.github/workflows/todo-cli-ci.yml'
      - '.github/scripts/**'
  workflow_dispatch:
    inputs:
      jira_issue_key:
        description: 'Jira issue key to review (e.g. TC-1). Leave empty to skip Jira review.'
        required: false
        default: 'TC-1'

permissions:
  contents: read

env:
  # 非机密配置：可直接放在 workflow，便于代码审阅
  JIRA_BASE_URL: https://hehuannie.atlassian.net
  JIRA_PROJECT_KEY: TC

jobs:
  test-and-review:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: todo-cli

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ---------- Python 测试 ----------
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          # 依赖声明在 pyproject.toml 中（含 dev extras）
          cache-dependency-path: 'todo-cli/pyproject.toml'

      - name: Install project + dev dependencies
        run: pip install -e ".[dev]"

      - name: Lint with ruff
        run: ruff check .

      - name: Run pytest (with coverage)
        run: pytest --cov

      # ---------- Copilot CLI 代码评审 ----------
      - name: Set up Node.js (for Copilot CLI)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 官方正确包名：@github/copilot
      - name: Install GitHub Copilot CLI
        run: npm install -g @github/copilot

      - name: Verify Copilot CLI
        run: copilot --version

      # 仓库 Settings > Secrets > Actions 中配置的 fine-grained PAT，
      # 名称：PERSONAL_ACCESS_TOKEN，权限至少包含 "Copilot Requests"
      - name: Copilot CLI - review todo-cli code
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
        run: |
          copilot -p "Inspect the Python files under the current directory (the todo-cli project: main.py, todo/*.py, tests/*.py). Produce a concise code review (<= 200 words) covering: (1) code quality observations, (2) up to 3 concrete improvement suggestions, (3) any missing test scenarios. Save the review to copilot-review.md as Markdown." \
            --allow-tool='shell(ls:*)' \
            --allow-tool='shell(cat:*)' \
            --allow-tool='shell(find:*)' \
            --allow-tool='write' \
            --no-ask-user

      - name: Publish code review to Job Summary
        run: |
          echo "## 🤖 Copilot Review for todo-cli" >> "$GITHUB_STEP_SUMMARY"
          cat copilot-review.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload code review artifact
        uses: actions/upload-artifact@v4
        with:
          name: copilot-review
          path: todo-cli/copilot-review.md

      # ==========================================================
      # 以下步骤仅在 workflow_dispatch 触发且提供 jira_issue_key 时执行：
      #   1. 通过 Jira REST API 拉取工单 -> jira-issue.md
      #   2. Copilot CLI 结合 todo-cli/ 代码评审工单 -> ticket-review.md
      #   3. 把评审结果以评论形式 POST 回 Jira 工单
      # ==========================================================
      - name: Install Jira helper dependencies (requests)
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.jira_issue_key != ''
        working-directory: .
        run: pip install --quiet requests

      - name: Fetch Jira issue via REST API
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.jira_issue_key != ''
        working-directory: .
        env:
          JIRA_BASE_URL: ${{ env.JIRA_BASE_URL }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          JIRA_ISSUE_KEY: ${{ github.event.inputs.jira_issue_key }}
        run: python .github/scripts/jira_fetch_issue.py

      - name: Copilot CLI - review Jira issue vs code
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.jira_issue_key != ''
        working-directory: .
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
          ISSUE_KEY: ${{ github.event.inputs.jira_issue_key }}
        run: |
          copilot -p "You are a senior engineer doing a ticket review. Read ./jira-issue.md (a Jira ticket exported via REST API) and cross-check it against the actual codebase under ./todo-cli/ (especially todo-cli/todo/**/*.py, todo-cli/pyproject.toml, todo-cli/README.md, todo-cli/tests/**). Produce a Markdown report with three sections: (A) Inconsistencies with code — files / modules / functions / versions referenced in the ticket that do NOT match the current code (e.g. wrong file paths, removed modules, wrong Python version, obsolete dependency files); (B) Missing details — important things the ticket forgot (e.g. REST API field updates, timezone handling, sort stability / secondary keys, CLI flag conflicts, migration of existing JSON data, test coverage gaps); (C) Risks & open questions — anything ambiguous or risky for implementation. Be concrete: cite exact file paths and symbol names. Keep the total output under 400 words. Write the report to ticket-review.md." \
            --allow-tool='shell(ls:*)' \
            --allow-tool='shell(cat:*)' \
            --allow-tool='shell(find:*)' \
            --allow-tool='shell(grep:*)' \
            --allow-tool='write' \
            --no-ask-user

      - name: Post review back to Jira as a comment
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.jira_issue_key != ''
        working-directory: .
        env:
          JIRA_BASE_URL: ${{ env.JIRA_BASE_URL }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          JIRA_ISSUE_KEY: ${{ github.event.inputs.jira_issue_key }}
          GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python .github/scripts/jira_post_comment.py

      - name: Publish ticket review to Job Summary
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.jira_issue_key != ''
        working-directory: .
        run: |
          echo "## 🎫 Copilot Ticket Review for Jira ${{ github.event.inputs.jira_issue_key }}" >> "$GITHUB_STEP_SUMMARY"
          if [ -f ticket-review.md ]; then
            cat ticket-review.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "_ticket-review.md was not produced by Copilot CLI._" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload ticket review artifact
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.jira_issue_key != ''
        uses: actions/upload-artifact@v4
        with:
          name: ticket-review-${{ github.event.inputs.jira_issue_key }}
          path: |
            ticket-review.md
            jira-issue.md
          if-no-files-found: warn

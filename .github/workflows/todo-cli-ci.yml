name: Todo CLI - Test & Copilot Review

# 关联 todo-cli/ Python 项目 + tickets/ 工单目录：
#   1. 监听 todo-cli/ 代码变更，运行 pytest 单元测试
#   2. 使用 GitHub Copilot CLI 审查代码，并把改进建议写入 Job Summary
#   3. 使用 GitHub Copilot CLI 结合实际代码评审 tickets/ 工单，
#      找出工单与代码之间的不一致、遗漏或风险
on:
  push:
    branches: [main, develop]
    paths:
      - 'todo-cli/**'
      - 'tickets/**'
      - '.github/workflows/todo-cli-ci.yml'
  pull_request:
    paths:
      - 'todo-cli/**'
      - 'tickets/**'
      - '.github/workflows/todo-cli-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-review:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: todo-cli

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ---------- Python 测试 ----------
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          # 依赖声明在 pyproject.toml 中（含 dev extras）
          cache-dependency-path: 'todo-cli/pyproject.toml'

      - name: Install project + dev dependencies
        run: pip install -e ".[dev]"

      - name: Lint with ruff
        run: ruff check .

      - name: Run pytest (with coverage)
        run: pytest --cov

      # ---------- Copilot CLI 代码评审 ----------
      - name: Set up Node.js (for Copilot CLI)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 官方正确包名：@github/copilot
      - name: Install GitHub Copilot CLI
        run: npm install -g @github/copilot

      - name: Verify Copilot CLI
        run: copilot --version

      # 仓库 Settings > Secrets > Actions 中配置的 fine-grained PAT，
      # 名称：PERSONAL_ACCESS_TOKEN，权限至少包含 "Copilot Requests"
      - name: Copilot CLI - review todo-cli code
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
        run: |
          copilot -p "Inspect the Python files under the current directory (the todo-cli project: main.py, todo/*.py, tests/*.py). Produce a concise code review (<= 200 words) covering: (1) code quality observations, (2) up to 3 concrete improvement suggestions, (3) any missing test scenarios. Save the review to copilot-review.md as Markdown." \
            --allow-tool='shell(ls:*)' \
            --allow-tool='shell(cat:*)' \
            --allow-tool='shell(find:*)' \
            --allow-tool='write' \
            --no-ask-user

      - name: Publish review to Job Summary
        run: |
          echo "## 🤖 Copilot Review for todo-cli" >> "$GITHUB_STEP_SUMMARY"
          cat copilot-review.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload review artifact
        uses: actions/upload-artifact@v4
        with:
          name: copilot-review
          path: todo-cli/copilot-review.md

      # ---------- Copilot CLI 工单评审（tickets/ vs todo-cli/ 代码） ----------
      # 让 Copilot 同时读取 tickets/*.md 与 todo-cli/todo/**/*.py，
      # 找出工单描述与实际代码的不一致、遗漏和潜在风险。
      # 注意：此步骤需要访问仓库根目录下的 tickets/，因此用 working-directory: . 覆盖默认值。
      - name: Copilot CLI - review tickets against code
        working-directory: .
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
        run: |
          copilot -p "You are a senior engineer doing a ticket review. Read every Markdown file under ./tickets/ (skip tickets/README.md) and cross-check each ticket against the actual codebase under ./todo-cli/ (especially todo-cli/todo/**/*.py, todo-cli/pyproject.toml, todo-cli/README.md, todo-cli/tests/**). For EACH ticket produce a report with these sections: (A) Inconsistencies with code — files/modules/functions/versions referenced in the ticket that do NOT match the current code (e.g. wrong file paths, removed modules, wrong Python version, obsolete dependency files); (B) Missing details — important things the ticket forgot (e.g. REST API field updates, timezone handling, sort stability/secondary keys, CLI flag conflicts, migration of existing JSON data, test coverage gaps); (C) Risks & open questions — anything ambiguous or risky for implementation. Be concrete: cite exact file paths and symbol names from the code. Keep the total output under 400 words. Write the result to ticket-review.md as Markdown with one top-level section per ticket." \
            --allow-tool='shell(ls:*)' \
            --allow-tool='shell(cat:*)' \
            --allow-tool='shell(find:*)' \
            --allow-tool='shell(grep:*)' \
            --allow-tool='write' \
            --no-ask-user

      - name: Publish ticket review to Job Summary
        working-directory: .
        run: |
          echo "## 🎫 Copilot Ticket Review (tickets/ vs todo-cli/)" >> "$GITHUB_STEP_SUMMARY"
          if [ -f ticket-review.md ]; then
            cat ticket-review.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "_ticket-review.md was not produced by Copilot CLI._" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload ticket review artifact
        uses: actions/upload-artifact@v4
        with:
          name: ticket-review
          path: ticket-review.md
          if-no-files-found: warn
